<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link id="icon" rel="icon" type="image/png" href="./src/assets/coin-front.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <title>FIAP OTEL Bank — Demo de Observabilidade</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        /* Véu branco sobre a arte: sem ele, o texto preto que fica direto
           sobre o fundo (os filtros da tela de caixas eletrônicos, por
           exemplo) some no meio da imagem, que é clara e muito detalhada.
           Ajuste a legibilidade mudando só os dois 0.65 abaixo - quanto
           maior, mais claro o fundo e mais legível o texto. Medido: 0.45
           ainda é pouco, 0.85 apaga a arte. */
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.65),
            rgba(255, 255, 255, 0.65)
          ),
          url(./src/assets/bank-background.webp);
        /* Foto com horizonte definido: `cover` + `no-repeat` evita a emenda
           que o `repeat-y` anterior produzia (céu colado no chão a cada
           repetição). `fixed` deixa o fundo parado enquanto o conteúdo rola
           dentro do #root. */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        opacity: 1;
      }

      #root{
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
