server {
    listen 8080;
    server_name localhost;

    # Endpoint de status do nginx, consumido pelo nginxreceiver do OTel
    # Collector. Sem ele, o modo --discovery encontra o nginx, tenta raspar
    # metricas e enche o journal com "expected 200 response, got 404".
    # Restrito ao proprio host: nao expoe nada para a internet.
    # /status e' o caminho PADRAO do nginxreceiver do OTel Collector, entao
    # servindo nele o modo --discovery funciona sem nenhum override.
    # /nginx_status fica como apelido, que e' a convencao mais comum.
    location ~ ^/(status|nginx_status)$ {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    location / {
        proxy_pass http://ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users {
        proxy_pass http://customer-auth:8000/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/atm {
        proxy_pass http://atm-locator:8001/api/atm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/account {
        proxy_pass http://dashboard:5000/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/transaction {
        proxy_pass http://dashboard:5000/transaction/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/loan {
        proxy_pass http://dashboard:5000/loan/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}