# =============================================================================
# dashboard (BFF) e ui (frontend React)
# =============================================================================
# O dashboard e' o ponto de fan-out do sistema: toda transferencia, extrato,
# abertura de conta e emprestimo passa por ele antes de chegar ao servico de
# negocio. No Service Map da aula 1 ele era o no' com mais arestas saindo;
# aqui ele e' quem torna visivel a cadeia ui -> dashboard -> transactions ->
# mongodb nas telas do Dynatrace.
#
# A UI serve HTML para o navegador do aluno. Ela NAO fala com os servicos pela
# rede do cluster: quem chama as APIs e' o navegador, de fora. Por isso ela
# precisa saber em que URL publica as APIs atendem -- e' o papel do
# FIAP_API_BASE abaixo (ver o comentario em k8s/istio/00-gateway.yaml).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fiap-bank
  labels: { app: dashboard, version: v1 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard, version: v1 }
  template:
    metadata:
      labels: { app: dashboard, version: v1 }
    spec:
      containers:
        - name: dashboard
          image: tonanuvem/fiap-bank-dashboard-otel:lab
          imagePullPolicy: Always
          ports:
            - { name: http-dashboard, containerPort: 5000 }
          envFrom:
            - configMapRef: { name: fiap-bank-config }
          env:
            - { name: OTEL_SERVICE_NAME, value: dashboard }
            # OTel RELIGADO -- so' nos servicos Python. Ver telas.md secao 7:
            # o code module do OneAgent instrumenta Node sozinho e NAO
            # instrumenta Python, entao aqui a instrumentacao tem que vir do
            # OpenTelemetry. O coletor e' o proprio DynaKube:
            #   kubectl -n dynatrace get svc telemetry-ingest
            - { name: OTEL_SDK_DISABLED, value: "false" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://telemetry-ingest.dynatrace:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "grpc" }
            # false mantem o SyntaxError do frontend, que e' material da aula 1.
            # Em true, a falha responde JSON 503 limpo.
            - { name: ERROS_AMIGAVEIS, value: "false" }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fiap-bank
  labels: { app: dashboard }
spec:
  selector: { app: dashboard }
  ports:
    - { name: http-dashboard, port: 5000, targetPort: 5000 }
---
# ----------------------------------------------------------------------- ui
# imagePullPolicy: Always em todos os Deployments deste laboratorio, e nao
# IfNotPresent. A tag :lab e' MUTAVEL -- toda republicacao reaproveita o mesmo
# nome. Com IfNotPresent o no' guarda a imagem velha em cache para sempre:
# voce publica, reinicia o Deployment, o pod sobe em segundos e nada muda,
# sem um erro sequer para explicar o porque.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: fiap-bank
  labels: { app: ui, version: v1 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ui, version: v1 }
  template:
    metadata:
      labels: { app: ui, version: v1 }
    spec:
      containers:
        - name: ui
          image: tonanuvem/fiap-bank-ui-otel:lab
          imagePullPolicy: Always
          ports:
            - { name: http-ui, containerPort: 3000 }
          env:
            - { name: DEPLOYMENT_ENV, value: "lab-fiap-k8s" }
            - { name: APP_VERSION,    value: "1.0.0" }
            # ---------------------------------------------------------------
            # ORIGEM UNICA. No compose o navegador falava com tres portas do
            # host (5000, 8000, 8001). Aqui tudo entra pelo Gateway do Istio,
            # numa porta so', e o caminho distingue o destino.
            #
            # Vazio = comportamento das aulas 1 e 2 (host:5000/8000/8001).
            # Preenchido pelo run-lab-k8s.sh com a URL do Gateway.
            # ---------------------------------------------------------------
            - { name: FIAP_API_BASE, value: "" }
            # RUM do Grafana (aula 2). Vazio = desligado.
            - { name: FARO_COLLECTOR_URL, value: "" }
            # -----------------------------------------------------------------
            # RUM DA DYNATRACE -- tem que ser manual, e o motivo importa.
            #
            # O OneAgent injeta o agente de RUM reescrevendo a resposta HTML do
            # servidor web. Este container nao serve HTML estatico: roda o VITE
            # EM MODO DEV, que o OneAgent nao instrumenta. Medido neste
            # laboratorio, com o agente comprovadamente carregado no processo
            # (liboneagentproc 5x em /proc/1/maps):
            #
            #   curl -D - -o /dev/null http://IP:30400/
            #   -> 200, text/html, chunked, SEM Server-Timing e SEM x-dynatrace
            #
            # Sem Server-Timing nao ha injecao. E sem agente no navegador nao
            # existe o salto navegador -> backend: a aplicacao web fica solta no
            # Smartscape por mais que se navegue na tela.
            #
            # Copie a URL em <aplicacao web> > Settings > Instrumentation >
            # JavaScript tag > Manual insertion:
            #   https://<tenant>.live.dynatrace.com/jstag/<hash>/<appId>_complete.js
            #
            # ATENCAO: a imagem precisa conter a versao do
            # ui/otel-rum-entrypoint.sh que le esta variavel. Se a sua for
            # anterior, reconstrua e publique antes.
            # -----------------------------------------------------------------
            - { name: DT_RUM_SRC, value: "" }
          # O pod demora para atender: o vite transpila os modulos sob demanda
          # na primeira requisicao. Sem readiness probe o Service manda
          # trafego para um pod que ainda nao escuta, e o Envoy responde
          # "no healthy upstream" -- que parece falha de malha e e' so' espera.
          # Com a probe, o rollout do script tambem passa a esperar de verdade.
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36          # ate' 3 min para o primeiro boot
          # ATENCAO AOS LIMITES. Este container nao serve arquivos estaticos:
          # ele roda o VITE EM MODO DEV, que e' Node mais esbuild e e' o
          # processo mais pesado do laboratorio. Com os 256Mi que estavam aqui
          # o kernel matava o processo por OOM assim que o aluno navegava umas
          # poucas telas, o pod reiniciava e a UI respondia 503 em laco --
          # sem erro na aplicacao, porque quem mata e' o cgroup.
          resources:
            requests: { memory: 256Mi, cpu: 200m }
            limits:   { memory: 1Gi,   cpu: 1000m }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: fiap-bank
  labels: { app: ui }
spec:
  selector: { app: ui }
  ports:
    - { name: http-ui, port: 3000, targetPort: 3000 }
