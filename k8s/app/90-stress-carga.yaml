# =============================================================================
# CARGA -- sem ela o laboratorio nao funciona
# =============================================================================
# Nao e' um detalhe de conveniencia: o Davis constroi LINHA DE BASE. Sem 30 a
# 40 minutos de comportamento saudavel gravado, ele nao tem contra o que
# comparar e NAO ABRE PROBLEMA NENHUM no game day do bloco 4. A aula inteira
# depende deste arquivo estar no ar desde o comeco.
#
# Por isso os blocos 1 e 2 do roteiro nao tocam no Dynatrace: eles existem
# tambem para dar tempo ao baseline.
#
# -----------------------------------------------------------------------------
# DUAS OPCOES, e a diferenca importa
# -----------------------------------------------------------------------------
#   stress-carga (ligada por padrao)
#       curl em laco. Nenhuma imagem para construir, sobe em segundos.
#       Exercita login -> contas -> extrato: passa por customer-auth,
#       dashboard, accounts, transactions e mongodb. Suficiente para o
#       baseline do Davis, para o Service Map ficar povoado e para as
#       metricas de infraestrutura.
#
#   locust (comentada)
#       Os cenarios de negocio DE VERDADE -- os mesmos .py das aulas 1 e 2,
#       com transferencia acima do saldo, emprestimo negado e FALHA_PCT.
#       Exige publicar a imagem uma vez (comando abaixo).
#
# Para o roteiro como esta escrito, stress-carga basta. Use o locust se quiser
# os mesmos numeros de negocio das aulas anteriores lado a lado.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: stress-carga
  namespace: fiap-bank
data:
  carga.sh: |
    #!/bin/sh
    # Jornada minima, em laco: autentica, lista contas, pede extrato.
    # Os enderecos sao os Services do cluster -- esta carga roda DENTRO da
    # malha, entao ela tambem aparece no Kiali e no Service Map.
    #
    # ATENCAO AOS CAMINHOS E AO FORMATO DO CORPO. Os dois servicos nao falam
    # a mesma lingua, e errar isso nao derruba nada: so' enche o grafico de
    # 400 e 404, com os servicos de negocio ociosos.
    #   customer-auth (Express)  -> JSON          em /api/users/...
    #   dashboard (Flask)        -> FORM-URLENCODED, porque o codigo le
    #                               request.form["..."], nao request.json
    AUTH="http://customer-auth:8000/api/users"
    DASH="http://dashboard:5000"
    EMAIL="${EMAIL:-teste@teste.com}"
    SENHA="${SENHA:-Teste@123}"
    NOME="${NOME:-Aluno FIAP}"
    PAUSA="${PAUSA:-2}"

    contas() {
      curl -s -m 10 -X POST "$DASH/account/allaccounts" \
           --data-urlencode "email_id=$EMAIL"
    }

    # ---- preparo: o MongoDB deste laboratorio sobe VAZIO ---------------------
    # O volume e' emptyDir. Nao ha usuario, nao ha conta, nao ha extrato. Sem
    # este bloco o login responde 400 ("Invalid email or password") em todo
    # ciclo, a carga nunca passa do primeiro passo, accounts e transactions
    # ficam sem uma requisicao sequer -- e a linha de base que o Davis grava
    # e' feita so' de erro. Foi exatamente o que aconteceu na primeira subida.
    preparar() {
      # 1. usuario. Se ja' existir, o proprio servico devolve 400 e seguimos.
      curl -s -m 10 -o /dev/null -X POST "$AUTH/" \
           -H 'Content-Type: application/json' \
           -d "{\"name\":\"$NOME\",\"email\":\"$EMAIL\",\"password\":\"$SENHA\"}"

      # 2. conta corrente, so' se o cliente ainda nao tiver nenhuma. Como sao
      #    3 replicas subindo juntas, as tres podem passar por aqui na
      #    primeira vez; o accounts recusa a segunda conta do mesmo tipo para
      #    o mesmo e-mail, entao o estrago e' no maximo uma poupanca extra.
      if ! contas | grep -q account_number; then
        curl -s -m 10 -o /dev/null -X POST "$DASH/account/create" \
             --data-urlencode "email_id=$EMAIL" \
             --data-urlencode "name=$NOME" \
             --data-urlencode "account_type=Checking" \
             --data-urlencode "address=Av. Paulista, 1106" \
             --data-urlencode "govt_id_number=12345678900" \
             --data-urlencode "government_id_type=CPF"
      fi
    }

    descobrir_conta() {
      CONTA=$(contas | tr ',' '\n' | grep '"account_number"' | head -1 \
              | sed 's/.*: *"\([^"]*\)".*/\1/')
    }

    # Toda chamada passa por aqui, e o que nao for 2xx vai para o log. Sem
    # isso a carga falha em silencio: o grafico fica vermelho e ninguem sabe
    # qual requisicao, com qual corpo, deu qual codigo.
    CODIGO=""
    chamar() {
      rotulo="$1"; shift
      CODIGO=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$@")
      case "$CODIGO" in
        2*) ;;
        *) echo "[carga] $rotulo -> HTTP $CODIGO" ;;
      esac
    }

    # Espera os servicos atenderem antes de tentar criar qualquer coisa.
    # Quando o laboratorio inteiro sobe de uma vez, esta carga nasce junto com
    # o customer-auth: o registro do usuario leva 503, ninguem e' criado, e
    # como o preparo rodava UMA VEZ, todo login seguinte respondia 400 para
    # sempre -- a linha de base virava um muro de erro. Qualquer resposta HTTP
    # serve como sinal de vida; 000/502/503/504 nao.
    esperar_servicos() {
      tentativa=0
      while [ "$tentativa" -lt 60 ]; do
        vivo=$(curl -s -o /dev/null -m 5 -w '%{http_code}' -X POST "$AUTH/auth" \
               -H 'Content-Type: application/json' -d '{}')
        case "$vivo" in
          000|502|503|504) ;;
          *) echo "[carga] servicos de pe (HTTP $vivo)"; return 0 ;;
        esac
        tentativa=$((tentativa + 1))
        sleep 5
      done
      echo "[carga] servicos nao responderam em 5 min -- seguindo assim mesmo"
    }

    echo "[carga] preparando dados (usuario e conta)"
    esperar_servicos
    preparar
    descobrir_conta
    echo "[carga] conta=${CONTA:-nenhuma} -- pausa de ${PAUSA}s entre ciclos"

    CICLO=0
    FALHAS=0
    while true; do
      # 1. login (customer-auth -> mongodb)
      chamar login -X POST "$AUTH/auth" \
             -H 'Content-Type: application/json' \
             -d "{\"email\":\"$EMAIL\",\"password\":\"$SENHA\"}"

      # Login que falha quer dizer, quase sempre, usuario inexistente -- o
      # banco deste lab e' emptyDir e nasce vazio. Em vez de repetir o erro
      # ate' o fim da aula, refaz o preparo. No maximo a cada 15 ciclos, para
      # nao transformar a recuperacao num segundo problema.
      case "$CODIGO" in
        2*) FALHAS=0 ;;
        *)  FALHAS=$((FALHAS + 1))
            if [ "$FALHAS" -ge 15 ]; then
              echo "[carga] login falhando ($CODIGO) -- refazendo o preparo"
              preparar
              descobrir_conta
              FALHAS=0
            fi ;;
      esac

      # 2. contas do cliente (dashboard -> accounts -> mongodb)
      chamar contas -X POST "$DASH/account/allaccounts" \
             --data-urlencode "email_id=$EMAIL"

      # 3. extrato (dashboard -> transactions -> mongodb)
      #    E' o caminho que o game day vai degradar. Sem esta chamada o
      #    servico transactions fica ocioso e nao ha o que observar.
      if [ -n "$CONTA" ]; then
        chamar extrato -X POST "$DASH/transaction/history" \
               --data-urlencode "account_number=$CONTA"
      else
        # Sem conta nao ha extrato. Tenta de novo: a conta pode ter sido
        # criada depois, por outra replica ou pela aula.
        descobrir_conta
        [ -n "$CONTA" ] && echo "[carga] conta encontrada: $CONTA"
      fi

      CICLO=$((CICLO + 1))
      [ $((CICLO % 60)) -eq 0 ] && echo "[carga] $CICLO ciclos, conta=${CONTA:-nenhuma}"

      sleep "$PAUSA"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-carga
  namespace: fiap-bank
  labels: { app: stress-carga, version: v1 }
spec:
  # 3 replicas em vez de 1: com uma so', uma pausa de rede vira um buraco no
  # grafico e o Davis pode interpretar como anomalia. Tres dao um fluxo
  # continuo o bastante para a linha de base ficar estavel.
  replicas: 3
  selector:
    matchLabels: { app: stress-carga }
  template:
    metadata:
      labels: { app: stress-carga, version: v1 }
    spec:
      containers:
        - name: carga
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/script/carga.sh"]
          env:
            - { name: PAUSA, value: "2" }
          volumeMounts:
            - { name: script, mountPath: /script }
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits:   { memory: 64Mi, cpu: 100m }
      volumes:
        - name: script
          configMap: { name: stress-carga }
---
