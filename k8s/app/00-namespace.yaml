# =============================================================================
# FIAP OTEL BANK no Kubernetes -- namespace e configuracao comum
# =============================================================================
# O rotulo istio-injection=enabled e' o que faz o Istio injetar o sidecar
# Envoy em TODO pod criado neste namespace. Sem ele os pods sobem, a aplicacao
# funciona e nada aparece no Kiali.
#
# O rotulo nao e' retroativo: se esquecer, `kubectl -n fiap-bank rollout
# restart deploy`.
#
# ONDE O ENVOY APARECE -- a pegadinha deste laboratorio.
# Desde o Istio 1.2x rodando em Kubernetes 1.29+, a injecao usa SIDECAR
# NATIVO: o Envoy entra como initContainer com restartPolicy: Always, e NAO
# aparece em .spec.containers. Quem confere a malha com
#
#   kubectl get pods -o jsonpath='{.items[*].spec.containers[*].name}'
#
# ve um pod sem Envoy que esta perfeitamente injetado. Confira pelo READY, que
# conta o sidecar nativo:
#
#   kubectl -n fiap-bank get pods
#     READY 2/2  = aplicacao + Envoy   (correto)
#     READY 1/1  = sem Envoy
#
# E se realmente faltar sidecar, o rotulo pode nao ser este. Pergunte ao
# webhook qual ele exige, em vez de confiar na memoria:
#
#   kubectl get mutatingwebhookconfiguration istio-revision-tag-default \
#     -o jsonpath='{range .webhooks[*]}{.name}{" ns="}{.namespaceSelector}{"\n"}{end}'
#
# Ha duas entradas possiveis, e as duas costumam existir juntas:
#   namespace.sidecar-injector.istio.io      -> exige istio-injection: enabled
#   rev.namespace.sidecar-injector.istio.io  -> exige istio.io/rev: <tag>  E
#                                               NENHUM rotulo istio-injection
# Por isso os dois rotulos juntos sao pior que um so': a presenca de
# istio-injection desqualifica a entrada rev.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: fiap-bank
  labels:
    istio-injection: enabled
    # Lido pelo metadataEnrichment do Dynatrace: vira atributo em todo span,
    # log e metrica deste namespace, e e' o que permite filtrar por
    # "aplicacao" em vez de por "pod" nas telas do LAB.
    app.kubernetes.io/part-of: fiap-bank
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fiap-bank-config
  namespace: fiap-bank
data:
  # ---------------------------------------------------------------------
  # DNS interno: no compose os servicos se achavam pelo nome do container.
  # No Kubernetes o nome do Service cumpre o mesmo papel, entao os valores
  # sao identicos aos do docker-compose-network-docker-internal.yml.
  # ---------------------------------------------------------------------
  ACCOUNT_HOST: "accounts"
  TRANSACTION_HOST: "transactions"
  LOAN_HOST: "loan"
  CUSTOMER_AUTH_HOST: "customer-auth"
  ATM_LOCATOR_HOST: "atm-locator"
  SERVICE_PROTOCOL: "http"
  DB_URL: "mongodb://mongodb:27017/bank"
  DEPLOYMENT_ENV: "lab-fiap-k8s"

  # ---------------------------------------------------------------------
  # OTel DESLIGADO por padrao neste laboratorio -- e' a decisao mais
  # importante deste arquivo, entao vale a explicacao completa.
  #
  # As imagens -otel sobem com `opentelemetry-instrument` (Python) e com
  # `--require @splunk/otel/instrument` (Node) no proprio ENTRYPOINT: a
  # instrumentacao OTel esta COMPILADA na imagem, nao e' opcional.
  #
  # Aqui quem instrumenta e' o OneAgent do Dynatrace (cloudNativeFullStack),
  # que injeta no processo sem tocar na imagem. Deixar os dois ligados ao
  # mesmo tempo da' dois problemas:
  #   1. span duplicado -- a mesma requisicao aparece duas vezes no trace;
  #   2. o SDK OTel tenta exportar para o default localhost:4317, onde nao
  #      ha collector nenhum, e enche o log do pod de "connection refused"
  #      a cada export. No LAB isso polui justamente a tela de Logs que
  #      vamos usar para comparar com o Loki da aula 2.
  #
  # OTEL_SDK_DISABLED=true desliga o SDK no arranque e resolve os dois.
  #
  # MAS ISSO VALE SO' PARA NODE -- medido no tenant, depois de uma hora de
  # carga. O code module do OneAgent instrumenta Node automaticamente e NAO
  # instrumenta Python: com o SDK desligado, `dashboard`, `accounts`,
  # `transactions` e `loan` sumiram inteiros do Distributed Tracing, e o
  # Service dependency graph ficou com dois servicos.
  #
  # Por isso os cinco Deployments Python sobrescrevem este valor para "false"
  # e exportam para o coletor que o proprio DynaKube sobe
  # (telemetry-ingest.dynatrace:4317). Os dois servicos Node continuam aqui,
  # desligados, com o OneAgent fazendo o trabalho.
  #
  # O arranjo hibrido nao e' remendo, e' o caso real: o agente proprietario
  # cobre as linguagens que cobre, e o OpenTelemetry -- o mesmo das aulas 1
  # e 2 -- preenche o resto, com tudo chegando no mesmo backend.
  # O wrapper continua no entrypoint, apenas nao faz nada.
  #
  # Para LIGAR o OTel apontando para o Dynatrace (exercicio opcional do
  # bloco de ingestao aberta), troque para "false" e descomente o endpoint
  # do ActiveGate abaixo -- e' o mesmo caminho que o Splunk usou na aula 1,
  # trocando so' o destino.
  # ---------------------------------------------------------------------
  OTEL_SDK_DISABLED: "true"
  # OTEL_EXPORTER_OTLP_ENDPOINT: "https://dynakube-activegate.dynatrace:9999/e/<TENANT>/api/v2/otlp"
