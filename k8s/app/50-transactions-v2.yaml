# =============================================================================
# transactions v2 -- a "versao nova" que o canary vai avaliar
# =============================================================================
# Reproduz, em Kubernetes, a v1.3.0 da aula 2: +1,4s de latencia e 15% de
# HTTP 500. Mesmas variaveis, mesma imagem, mesmo codigo -- so' muda o env.
#
# POR QUE ESTE DEPLOYMENT EXISTE, se o Istio ja' sabe injetar falha:
# sao duas coisas diferentes, e a aula compara as duas.
#
#   v2 (este arquivo)     -> a falha esta DENTRO do processo. Aparece no log
#                            da aplicacao, no stack trace, no span do servico.
#                            E' o incidente "normal": alguem fez deploy ruim.
#
#   fault injection       -> a falha esta NA MALHA (k8s/istio/30-caos.yaml).
#   (Istio)                  O container esta intacto, o log nao tem nada, e
#                            mesmo assim o cliente ve erro. E' o cenario que
#                            derruba o reflexo de "olhar o log do servico".
#
# O aluno deve conseguir distinguir uma da outra OLHANDO A TELA, sem saber de
# antemao qual foi aplicada. Essa e' a pergunta do game day no roteiro.
#
# Nao ha `replicas: 0` aqui: o v2 sobe junto com o resto. Quem controla se ele
# recebe trafego e' o VirtualService, nao o numero de pods -- essa separacao
# entre "estar no ar" e "receber carga" e' o conceito central do canary.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-v2
  namespace: fiap-bank
  labels: { app: transactions, version: v2 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: transactions, version: v2 }
  template:
    metadata:
      labels: { app: transactions, version: v2 }
    spec:
      containers:
        - name: transactions
          image: tonanuvem/fiap-bank-transactions-otel:lab
          imagePullPolicy: Always
          ports:
            - { name: http-trans, containerPort: 50052 }
          envFrom:
            - configMapRef: { name: fiap-bank-config }
          env:
            - { name: OTEL_SERVICE_NAME, value: transactions }
            # ---------------------------------------------------------------
            # O perfil da v1.3.0 da aula 2: lentidao E erro ao mesmo tempo.
            #
            # Para encenar a v1.2.0 (a "degradacao silenciosa", que e' o caso
            # mais interessante porque o mapa continua VERDE), zere so' a
            # falha e mantenha o atraso:
            #   kubectl -n fiap-bank set env deploy/transactions-v2 \
            #       FALHA_ARTIFICIAL_PCT=0
            # ---------------------------------------------------------------
            - { name: APP_VERSION,          value: "1.3.0" }
            - { name: ATRASO_ARTIFICIAL_MS, value: "1400" }
            - { name: ATRASO_JITTER_MS,     value: "300" }
            - { name: FALHA_ARTIFICIAL_PCT, value: "15" }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 500m }
