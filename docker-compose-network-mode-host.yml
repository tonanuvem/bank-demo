# =============================================================================
# Martian Bank + Splunk Observability  --  VARIANTE A: network_mode: host
# =============================================================================
#   docker compose -f docker-compose-network-mode-host.yml up -d --build
#
# POR QUE ESTA VARIANTE E' A MAIS SIMPLES NO SEU LAB:
#   Seu collector escuta em 127.0.0.1:4317/4318 (confirmado pelo seu `ss`).
#   Em host mode o container COMPARTILHA a stack de rede da EC2, entao
#   http://localhost:4317 dentro do container E' o collector. Zero mudanca
#   no /etc/otel/collector/.
#
# CONSEQUENCIAS DO HOST MODE (todas esperadas):
#   - `ports:` nao existe/e' ignorado: cada processo bind direto na EC2.
#   - Nao ha DNS do Docker: todo service-to-service vira localhost.
#     (o codigo ja usa "localhost" como default de ACCOUNT_HOST etc.)
#   - Conflito de porta e' com a EC2 inteira. Pare o run-demo-bank.sh antes:
#       sudo lsof -i:3000 -i:5000 -i:8000 -i:8001 -i:50051 -i:50052 -i:50053
#
# MONGODB: reusa o container `fiap-mongodb` que ja roda na EC2
# (0.0.0.0:27017). Se nao existir:
#   docker run -d --name fiap-mongodb --restart unless-stopped \
#     -p 27017:27017 -v fiap-mongodb-data:/data/db mongo:7
#
# Variaveis: copie .env.otel.example para .env (mesma pasta) e edite.
# =============================================================================

name: fiapbank-otel-host

# ----- bloco reutilizavel: config OTel comum a todos os servicos -----
x-otel-common: &otel-common
  # Endpoint OTLP do collector. Em host mode: localhost mesmo.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
  # deployment.environment e' o filtro "Environment" do APM. Use o MESMO
  # valor no RUM para casar frontend e backend na mesma visao.
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${DEPLOYMENT_ENV:-lab-fiap},service.namespace=fiap-bank,service.version=${APP_VERSION:-1.0.0}"
  # Metricas custom consomem cota de MTS da org. Ligue so quando quiser:
  OTEL_METRICS_EXPORTER: "${OTEL_METRICS_EXPORTER:-none}"
  # Logs das apps Python via OTLP, correlacionados com o trace (trace_id e
  # span_id dentro do LogRecord). Default "none" porque o Splunk Observability
  # Cloud nao aceita mais ingestao direta de logs: o Log Observer nativo foi
  # descontinuado em favor do Log Observer Connect, que le de um Splunk Cloud/
  # Enterprise. Com o exporter ligado contra o endpoint morto, o collector
  # entra em retry infinito. Ligue (otlp) quando tiver um HEC de verdade.
  OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-none}"
  # AlwaysOn Profiling tambem depende do pipeline de logs/HEC.
  SPLUNK_PROFILER_ENABLED: "${SPLUNK_PROFILER_ENABLED:-false}"

x-otel-python: &otel-python
  <<: *otel-common
  # injeta trace_id/span_id nos logs do logging padrao do Python
  OTEL_PYTHON_LOG_CORRELATION: "true"
  # Se o volume de logs incomodar, descomente para so exportar INFO+ .
  # Cuidado: as apps logam quase tudo em DEBUG, entao "info" faz sumir
  # justamente as mensagens da aplicacao (e a correlacao com o trace).
  # O ruido ocioso do driver do Mongo ja e' silenciado no Dockerfile-otel.
  # OTEL_PYTHON_LOG_HANDLER_LEVEL: "info"

# ----- logs de containers que NAO falam OTLP (Node, nginx, UI) -----
# Usa o log driver `fluentd` do proprio Docker apontando para o receiver
# fluent_forward que o agent_config.yaml da Splunk JA expoe em :8006.
#
# DETALHE IMPORTANTE: quem abre essa conexao e' o DAEMON do Docker, no host -
# nao o container. Por isso 127.0.0.1:8006 funciona nas DUAS variantes de rede,
# e nao exige SPLUNK_LISTEN_INTERFACE=0.0.0.0 (so o OTLP exige).
#
# fluentd-async=true e' OBRIGATORIO: testado, sem ele o container se recusa a
# subir enquanto o collector estiver fora do ar.
#
# `docker logs` continua funcionando (dual logging do Docker) - tambem testado.
x-fluentd-logging: &fluentd-logging
  driver: fluentd
  options:
    fluentd-address: "tcp://127.0.0.1:8006"
    fluentd-async: "true"
    fluentd-max-retries: "10"
    tag: "martianbank.{{.Name}}"
    labels: "service.name,deployment.environment"

services:

  # ---------------------------------------------------------------- dashboard
  # API gateway Flask. E' quem costura o trace distribuido (usa `requests`).
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile-otel
    image: fiap-bank-dashboard-otel
    network_mode: host
    restart: always
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: dashboard
      DB_URL: "${DB_URL:-mongodb://localhost:27017/martianbank}"
      SERVICE_PROTOCOL: http
      ACCOUNT_HOST: localhost
      TRANSACTION_HOST: localhost
      LOAN_HOST: localhost
      CUSTOMER_AUTH_HOST: localhost
      ATM_LOCATOR_HOST: localhost

  # ----------------------------------------------------------------- accounts
  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile-otel
    image: fiap-bank-accounts-otel
    network_mode: host
    restart: always
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: accounts
      DB_URL: "${DB_URL:-mongodb://localhost:27017/martianbank}"
      SERVICE_PROTOCOL: http

  # ------------------------------------------------------------- transactions
  transactions:
    build:
      context: .
      dockerfile: transactions/Dockerfile-otel
    image: fiap-bank-transactions-otel
    network_mode: host
    restart: always
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: transactions
      DB_URL: "${DB_URL:-mongodb://localhost:27017/martianbank}"
      SERVICE_PROTOCOL: http

  # --------------------------------------------------------------------- loan
  loan:
    build:
      context: .
      dockerfile: loan/Dockerfile-otel
    image: fiap-bank-loan-otel
    network_mode: host
    restart: always
    environment:
      <<: *otel-python
      OTEL_SERVICE_NAME: loan
      DB_URL: "${DB_URL:-mongodb://localhost:27017/martianbank}"
      SERVICE_PROTOCOL: http

  # ------------------------------------------------------------ customer-auth
  customer-auth:
    build:
      context: ./customer-auth
      dockerfile: Dockerfile-otel
    image: fiap-bank-customer-auth-otel
    network_mode: host
    restart: always
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: customer-auth
      # ATENCAO: porta 4318, nao 4317. Testado: o @splunk/otel 4.x exporta em
      # OTLP/HTTP por padrao (diferente do agente Python, que usa gRPC). Apontar
      # o Node para 4317 faz o agente instrumentar tudo certinho e depois falhar
      # calado no envio: "Parse Error: Expected HTTP/" - zero spans no Splunk.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
      PORT: 8000
      DB_URL: "${DB_URL:-mongodb://localhost:27017/martianbank}"
    # DESATIVADO: o Splunk Observability Cloud nao aceita mais ingestao direta
    # de logs (Log Observer nativo -> Log Observer Connect), entao o exporter
    # splunk_hec do collector responde 404 e entra em retry infinito. Mandar
    # stdout para o fluent_forward so alimentaria esse loop.
    # Para religar (ex.: apontando o collector para um Splunk Enterprise com
    # HEC), descomente as duas linhas abaixo:
    # logging: *fluentd-logging
    labels:
      service.name: customer-auth
      deployment.environment: "${DEPLOYMENT_ENV:-lab-fiap}"


  # -------------------------------------------------------------- atm-locator
  atm-locator:
    build:
      context: ./atm-locator
      dockerfile: Dockerfile-otel
    image: fiap-bank-atm-locator-otel
    network_mode: host
    restart: always
    environment:
      <<: *otel-common
      OTEL_SERVICE_NAME: atm-locator
      # ATENCAO: porta 4318, nao 4317. Testado: o @splunk/otel 4.x exporta em
      # OTLP/HTTP por padrao (diferente do agente Python, que usa gRPC). Apontar
      # o Node para 4317 faz o agente instrumentar tudo certinho e depois falhar
      # calado no envio: "Parse Error: Expected HTTP/" - zero spans no Splunk.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
      PORT: 8001
      DB_URL: "${DB_URL:-mongodb://localhost:27017/martianbank}"
    # DESATIVADO: o Splunk Observability Cloud nao aceita mais ingestao direta
    # de logs (Log Observer nativo -> Log Observer Connect), entao o exporter
    # splunk_hec do collector responde 404 e entra em retry infinito. Mandar
    # stdout para o fluent_forward so alimentaria esse loop.
    # Para religar (ex.: apontando o collector para um Splunk Enterprise com
    # HEC), descomente as duas linhas abaixo:
    # logging: *fluentd-logging
    labels:
      service.name: atm-locator
      deployment.environment: "${DEPLOYMENT_ENV:-lab-fiap}"


  # ----------------------------------------------------------------------- ui
  # RUM roda no NAVEGADOR e envia direto para o Splunk Cloud: nao usa o
  # collector nem o OTEL_EXPORTER_OTLP_ENDPOINT.
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile-otel
    image: fiap-bank-ui-otel
    network_mode: host
    restart: always
    environment:
      SPLUNK_RUM_TOKEN: "${SPLUNK_RUM_TOKEN:-}"
      SPLUNK_RUM_REALM: "${SPLUNK_REALM:-us1}"
      SPLUNK_RUM_APP_NAME: "${SPLUNK_RUM_APP_NAME:-fiap-bank-ui}"
      DEPLOYMENT_ENV: "${DEPLOYMENT_ENV:-lab-fiap}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    # DESATIVADO: o Splunk Observability Cloud nao aceita mais ingestao direta
    # de logs (Log Observer nativo -> Log Observer Connect), entao o exporter
    # splunk_hec do collector responde 404 e entra em retry infinito. Mandar
    # stdout para o fluent_forward so alimentaria esse loop.
    # Para religar (ex.: apontando o collector para um Splunk Enterprise com
    # HEC), descomente as duas linhas abaixo:
    # logging: *fluentd-logging
    labels:
      service.name: fiap-bank-ui
      deployment.environment: "${DEPLOYMENT_ENV:-lab-fiap}"


  # -------------------------------------------------------------------- nginx
  nginx:
    build:
      context: ./nginx
    image: fiap-bank-nginx
    network_mode: host
    restart: always
    depends_on:
      - ui
      - customer-auth
      - atm-locator
      - dashboard
    # em host mode os upstreams por nome nao resolvem -> conf alternativa
    volumes:
      - ./nginx/default-host.conf:/etc/nginx/conf.d/default.conf:ro
    # DESATIVADO: o Splunk Observability Cloud nao aceita mais ingestao direta
    # de logs (Log Observer nativo -> Log Observer Connect), entao o exporter
    # splunk_hec do collector responde 404 e entra em retry infinito. Mandar
    # stdout para o fluent_forward so alimentaria esse loop.
    # Para religar (ex.: apontando o collector para um Splunk Enterprise com
    # HEC), descomente as duas linhas abaixo:
    # logging: *fluentd-logging
    labels:
      service.name: nginx
      deployment.environment: "${DEPLOYMENT_ENV:-lab-fiap}"


  # ------------------------------------------------------------------- locust
  # opcional: docker compose -f <arquivo> --profile load up -d locust
  locust:
    build:
      context: ./performance_locust
    image: fiap-bank-locust
    network_mode: host
    restart: always
    profiles: ["load"]
